<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pokémon FireRed</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    #game { width: 100%; height: 100%; }
    #dbg:empty { display: none; }
    #dbg {
      position: fixed; left: 0; right: 0; top: 0; z-index: 99999;
      background: #900; color: #fff; font: 12px monospace;
      white-space: pre-wrap; max-height: 40%; overflow: auto; padding: 6px;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="dbg"></div>

  <script>
    const d = document.getElementById('dbg');
    const log = m => { d.textContent += m + '\n'; };
    window.addEventListener('error', e => log('ERRO: ' + e.message));
    window.addEventListener('unhandledrejection', e =>
      log('PROMESSA: ' + ((e.reason && e.reason.message) || e.reason)));
    const oe = console.error;
    console.error = (...a) => { log('console.error: ' + a.join(' ')); oe.apply(console, a); };

    EJS_player = "#game";
    EJS_core = "gba";
    EJS_gameUrl = "pokemon-firered.gba";
    EJS_gameName = "pokemon-firered";
    EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    EJS_onGameStart = () => log('jogo iniciou');
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
